/**
 * Loads the build plugins that supply Minecraft integration and artifact tasks.
 */
plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

/**
 * Sets artifact naming from the existing project properties.
 */
base {
    archivesName = project.archives_base_name
}

/**
 * Declares dependency repositories used by the build tool.
 */
repositories {
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}

/**
 * Configures Fabric source sets and loader integration.
 */
loom {
    splitEnvironmentSourceSets()

    mods {
        krypt04mcg {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

/**
 * Declares external libraries and test dependencies; cryptographic behavior belongs to runtime code.
 */
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
    include "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

/**
 * Expands build metadata in resources without changing runtime protocol settings.
 */
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

/**
 * Configures the named build task with the existing compilation, verification or packaging settings.
 */
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

/**
 * Configures the Java toolchain compatibility and source artifact generation.
 */
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

/**
 * Runs the configured tests through the JUnit Platform.
 */
test {
    useJUnitPlatform()
}
