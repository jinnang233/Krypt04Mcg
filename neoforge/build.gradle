plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.krypt04mcg'
base.archivesName = 'krypt04mcg-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    runs { client { client() } }
    mods { krypt04mcg { sourceSet(sourceSets.main) } }
}

sourceSets.main.java.srcDir('../src/main/java')
sourceSets.main.resources {
    srcDir('../src/main/resources')
    exclude('fabric.mod.json')
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    implementation(jarJar("org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"))
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Plain JVM regression tests exercise the shared JSON-backed services.
    testImplementation 'com.google.code.gson:gson:2.14.0'
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property('mod_version', mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: mod_version)
    }
}
test { useJUnitPlatform() }

// Exercise shared handshake regressions against this loader's chat entry point too.
tasks.named('compileTestJava') {
    classpath += tasks.named('compileJava').get().classpath
    source(fileTree('../src/test/java') {
        include 'dev/krypt04mcg/chat/HandshakeStateMachineTest.java'
        include 'dev/krypt04mcg/chat/ChatSessionIdentityTest.java'
        include 'dev/krypt04mcg/chat/FragmentSendQueueTest.java'
        include 'dev/krypt04mcg/chat/ChatSendPolicyTest.java'
        include 'dev/krypt04mcg/chat/ChatResendTrustTest.java'
        include 'dev/krypt04mcg/chat/TransferProgressTrackerTest.java'
        include 'dev/krypt04mcg/chat/ChatReceiveProgressTest.java'
        include 'dev/krypt04mcg/fragment/FragmentServiceTest.java'
        include 'dev/krypt04mcg/service/HandshakeFailureRecoveryTest.java'
        include 'dev/krypt04mcg/service/HandshakeEpochCommitTest.java'
        include 'dev/krypt04mcg/service/SessionServiceTest.java'
        include 'dev/krypt04mcg/service/DataTransferServiceTest.java'
        include 'dev/krypt04mcg/service/FileReceiveTaskTest.java'
    })
}
tasks.named('test') {
    classpath += tasks.named('compileJava').get().classpath
}
