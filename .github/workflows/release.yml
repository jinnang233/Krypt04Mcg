name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check OpenSSL Version
        shell: bash
        run: |
          docker run --rm \
              alpine/openssl version
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle build --no-daemon

      - name: Build NeoForge client
        run: gradle -p neoforge build --no-daemon

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} release-artifacts/ \;
          find neoforge/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - name: Add third-party license notices
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          BOUNCY_CASTLE_VERSION="$(sed -n 's/^bouncycastle_version=//p' gradle.properties)"
          FABRIC_API_VERSION="$(sed -n 's/^fabric_api_version=//p' gradle.properties)"
          FABRIC_LOADER_VERSION="$(sed -n 's/^loader_version=//p' gradle.properties)"
          FABRIC_LOOM_VERSION="$(sed -n 's/^loom_version=//p' gradle.properties)"
          CLOTH_CONFIG_VERSION="$(sed -n 's/^cloth_config_version=//p' gradle.properties)"
          MODMENU_VERSION="$(sed -n 's/^modmenu_version=//p' gradle.properties)"
          NEOFORGE_VERSION="$(sed -n 's/^neo_version=//p' neoforge/gradle.properties)"

          if [ -z "$BOUNCY_CASTLE_VERSION" ]; then
            echo "Could not determine Bouncy Castle version from gradle.properties"
            exit 1
          fi
          if [ -z "$FABRIC_API_VERSION" ]; then
            echo "Could not determine Fabric API version from gradle.properties"
            exit 1
          fi
          if [ -z "$FABRIC_LOADER_VERSION" ]; then
            echo "Could not determine Fabric Loader version from gradle.properties"
            exit 1
          fi
          if [ -z "$FABRIC_LOOM_VERSION" ]; then
            echo "Could not determine Fabric Loom version from gradle.properties"
            exit 1
          fi
          if [ -z "$CLOTH_CONFIG_VERSION" ]; then
            echo "Could not determine Cloth Config version from gradle.properties"
            exit 1
          fi
          if [ -z "$MODMENU_VERSION" ]; then
            echo "Could not determine Mod Menu version from gradle.properties"
            exit 1
          fi
          if [ -z "$NEOFORGE_VERSION" ]; then
            echo "Could not determine NeoForge version from gradle.properties"
            exit 1
          fi
          mkdir -p legal/META-INF
          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT
          # Third-party notices

          This distribution bundles third-party dependencies inside the release JAR.

          ## Bouncy Castle

          Dependency: \`org.bouncycastle:bcprov-jdk18on:${BOUNCY_CASTLE_VERSION}\`
          Project: https://www.bouncycastle.org/
          License: MIT License / Bouncy Castle License

          NOTICE_TXT
          cat THIRD_PARTY/BOUNCYCASTLE_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT
          
          
          ## Fabric API

          Dependency: \`net.fabricmc.fabric-api:fabric-api:${FABRIC_API_VERSION}\`
          Project: https://fabricmc.net/
          License: Apache-2.0 license

          NOTICE_TXT

          cat THIRD_PARTY/FABRIC_API_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT
        
          
          ## Fabric Loader
          Dependency: \`net.fabricmc:fabric-loader:${FABRIC_LOADER_VERSION}\`
          Project: https://fabricmc.net/
          License: Apache-2.0 license

          NOTICE_TXT
          
          cat THIRD_PARTY/FABRIC_LOADER_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT

          
          ## Fabric Loom
          Project: https://fabricmc.net/
          License: MIT License

          NOTICE_TXT

          cat THIRD_PARTY/FABRIC_LOOM_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT

          
          ## NeoForge
          Version: ${NEOFORGE_VERSION}
          Project: https://neoforged.net/
          License: LGPL-2.1 license

          NOTICE_TXT

          cat THIRD_PARTY/NEOFORGE_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT

          
          ## Cloth Config
          Dependency: \`me.shedaniel.cloth:cloth-config-fabric:${CLOTH_CONFIG_VERSION}\`
          Project: https://github.com/shedaniel/cloth-config
          License: LGPL license

          NOTICE_TXT

          cat THIRD_PARTY/CLOTH_CONFIG_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md

          cat >> release-artifacts/THIRD_PARTY_NOTICES.md <<NOTICE_TXT

          
          ## Mod Menu
          Dependency: \`com.terraformersmc:modmenu:${MODMENU_VERSION}\`
          Project: https://github.com/TerraformersMC/ModMenu
          License: MIT License

          NOTICE_TXT

          cat THIRD_PARTY/MOD_MENU_LICENSE >> release-artifacts/THIRD_PARTY_NOTICES.md


          sed -i 's/^          //' release-artifacts/THIRD_PARTY_NOTICES.md
          cp release-artifacts/THIRD_PARTY_NOTICES.md legal/META-INF/THIRD-PARTY-NOTICES.md

          jars=(release-artifacts/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No JAR files found for license notice embedding"
            exit 1
          fi

          for file in "${jars[@]}"; do
            (cd legal && jar uf "../${file}" META-INF/THIRD-PARTY-NOTICES.md)
            jar tf "$file" | grep -Fx 'META-INF/THIRD-PARTY-NOTICES.md' >/dev/null
          done

          ls -la release-artifacts

      - name: Generate snapshot tag
        id: snapshot
        shell: bash
        run: |
          echo "tag=snapshot-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "name=Snapshot $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            release-artifacts/*.jar
      - name: Generate release notes
        shell: bash
        env:
          RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || steps.snapshot.outputs.name }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          {
            echo "# ${RELEASE_NAME}"
            echo
            echo "## Changelog"
            echo

            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since \`${PREVIOUS_TAG}\`:"
              echo
              git log "${PREVIOUS_TAG}..HEAD" --pretty=format:'- %s (%h)' || true
            else
              echo "No previous tag was found. Recent changes:"
              echo
              git log -20 --pretty=format:'- %s (%h)' || true
            fi

            echo
            echo
            echo "## Build Artifacts"
            echo

            shopt -s nullglob
            for file in release-artifacts/*.jar; do
              sha256="$(sha256sum "$file" | awk '{print $1}')"
              filename="$(basename "$file")"

              echo "### ${filename}"
              echo
              echo "- SHA256: \`${sha256}\`"
              echo "- VirusTotal: https://www.virustotal.com/gui/file/${sha256}"
              echo
            done

            echo "## Third-party Notices"
            echo
            echo "Release JARs include bundled dependency notices at \`META-INF/THIRD-PARTY-NOTICES.md\`."
            echo "The same notice file is attached as \`THIRD_PARTY_NOTICES.md\`."
            echo
            echo "## Signature"
            echo
            echo "Each JAR file is signed with the detached \`.sign\` file."
            echo "The public key is included as \`public_key.pem\`."
          } > RELEASE_NOTE.md

          cat RELEASE_NOTE.md
      - name: Sign release artifacts
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          trap 'rm -f private_key.pem; echo "Cleaned up private key."' EXIT
          umask 077
          printf '%s\n' "$SIGN_PRIVATE_KEY" >private_key.pem

          files=(release-artifacts/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JAR files found to sign"
            exit 1
          fi
          docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              alpine/openssl pkey -pubout -in /work/private_key.pem -out /work/public_key.pem
          for file in "${files[@]}"; do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              alpine/openssl \
              dgst \
              -sign /work/private_key.pem \
              -out "/work/${file}.sign" \
              "/work/${file}"
          done
          rm -f private_key.pem
          ls -la release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.snapshot.outputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || steps.snapshot.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTE.md
          files: |
            release-artifacts/*.jar
            release-artifacts/*.jar.sign
            release-artifacts/THIRD_PARTY_NOTICES.md
            public_key.pem
